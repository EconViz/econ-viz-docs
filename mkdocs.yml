site_name: EconViz
site_url: https://econ-viz.org
site_description: "Open-source Python packages for economics diagrams: utility-viz, principle-viz, mosaickit and bezierkit."
site_author: Pin Yue Sung
repo_url: https://github.com/EconViz
repo_name: EconViz
copyright: >-
  &copy; 2026 Pin Yue Sung ·
  <a href="#__consent">Change cookie settings</a>

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/katex.js
  - javascripts/model-toc.js
  - javascripts/analytics-events.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_ID, ""]
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback. Tell us what could be improved in a
            <a href="https://github.com/EconViz/utility-viz/issues/new?title=[Docs]+{title}&body=Page:+{url}" target="_blank" rel="noopener">GitHub issue</a>.
  consent:
    title: Cookie consent
    description: >-
      We use analytics cookies to understand how the documentation is used
      and improve it, and load repository stats from GitHub.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics: Google Analytics
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:contact@econ-viz.org
      name: contact@econ-viz.org
    - icon: fontawesome/brands/github
      link: https://github.com/EconViz
      name: EconViz on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/utility-viz/
      name: utility-viz on PyPI

hooks:
  - hooks/i18n_404.py
  - hooks/citations.py

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          site_description: "用 Python 繪製經濟學圖形的開源套件：utility-viz、principle-viz、mosaickit 與 bezierkit。"
          copyright: >-
            &copy; 2026 Pin Yue Sung ·
            <a href="#__consent">變更 Cookie 設定</a>
          extra:
            analytics:
              provider: google
              property: !ENV [GOOGLE_ANALYTICS_ID, ""]
              feedback:
                title: 這頁有幫助嗎？
                ratings:
                  - icon: material/thumb-up-outline
                    name: 這頁有幫助
                    data: 1
                    note: 謝謝你的回饋
                  - icon: material/thumb-down-outline
                    name: 這頁可以改進
                    data: 0
                    note: >-
                      謝謝你的回饋。歡迎到
                      <a href="https://github.com/EconViz/utility-viz/issues/new?title=[Docs]+{title}&body=Page:+{url}" target="_blank" rel="noopener">GitHub issue</a>
                      告訴我們哪裡需要改進。
            consent:
              title: Cookie 設定
              description: 我們使用分析 Cookie 了解文件的使用方式並持續改善內容，也會從 GitHub 載入 repo 數據。
              actions:
                - accept
                - reject
                - manage
              cookies:
                analytics: Google Analytics
          nav_translations:
            Home: 首頁
            Getting Started: 入門
            Installation: 安裝
            Quick Start: 快速開始
            CLI: 命令列工具
            Drawing & Teaching: 繪圖與教學
            Canvas: Canvas 畫布
            Figures & Demand Diagrams: 多面板圖與需求圖
            Animation: 動畫
            Interactive Widgets: 互動元件
            Themes: 主題
            Settings File: 設定檔
            Export: 匯出
            Models: 模型
            Overview: 總覽
            Core Models: 核心模型
            Cobb-Douglas: Cobb-Douglas
            Perfect Substitutes: 完全替代
            CES: CES
            Translog: Translog
            Satiation: 飽和
            Quasi-Linear: 準線性
            Stone-Geary: Stone-Geary
            Advanced Models: 進階模型
            Tools & Analysis: 工具與分析
            Analysis: 分析
            LaTeX Parsing: LaTeX 解析
            Project: 專案
            Changelog: 更新紀錄
            References: 參考文獻
            PDF Manual: PDF 手冊
            Migrating from econ-viz: 從 econ-viz 遷移
        - locale: zh-CN
          name: 简体中文
          build: true
          theme:
            language: zh
          site_description: "用 Python 绘制经济学图形的开源包：utility-viz、principle-viz、mosaickit 与 bezierkit。"
          copyright: >-
            &copy; 2026 Pin Yue Sung ·
            <a href="#__consent">更改 Cookie 设置</a>
          extra:
            analytics:
              provider: google
              property: !ENV [GOOGLE_ANALYTICS_ID, ""]
              feedback:
                title: 这页有帮助吗？
                ratings:
                  - icon: material/thumb-up-outline
                    name: 这页有帮助
                    data: 1
                    note: 谢谢你的反馈
                  - icon: material/thumb-down-outline
                    name: 这页可以改进
                    data: 0
                    note: >-
                      谢谢你的反馈。欢迎到
                      <a href="https://github.com/EconViz/utility-viz/issues/new?title=[Docs]+{title}&body=Page:+{url}" target="_blank" rel="noopener">GitHub issue</a>
                      告诉我们哪里需要改进。
            consent:
              title: Cookie 设置
              description: 我们使用分析 Cookie 了解文档的使用方式并持续改善内容，也会从 GitHub 加载仓库数据。
              actions:
                - accept
                - reject
                - manage
              cookies:
                analytics: Google Analytics
          nav_translations:
            Home: 首页
            Getting Started: 入门
            Installation: 安装
            Quick Start: 快速开始
            CLI: 命令行工具
            Drawing & Teaching: 绘图与教学
            Canvas: Canvas 画布
            Figures & Demand Diagrams: 多面板图与需求图
            Animation: 动画
            Interactive Widgets: 交互组件
            Themes: 主题
            Settings File: 配置文件
            Export: 导出
            Models: 模型
            Overview: 概览
            Core Models: 核心模型
            Cobb-Douglas: Cobb-Douglas
            Perfect Substitutes: 完全替代
            CES: CES
            Translog: Translog
            Satiation: 饱和
            Quasi-Linear: 拟线性
            Stone-Geary: Stone-Geary
            Advanced Models: 高级模型
            Tools & Analysis: 工具与分析
            Analysis: 分析
            LaTeX Parsing: LaTeX 解析
            Project: 项目
            Changelog: 更新日志
            References: 参考文献
            PDF Manual: PDF 手册
            Migrating from econ-viz: 从 econ-viz 迁移
