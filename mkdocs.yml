site_name: Econ-Viz
site_url: https://econ-viz.org
site_description: A Python toolkit for producing publication-quality microeconomics diagrams.
site_author: Anthony Sung
repo_url: https://github.com/EconViz/econ-viz
repo_name: EconViz/econ-viz

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/katex.js
  - javascripts/model-toc.js
  - javascripts/analytics-events.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_ID, ""]
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback. Tell us what could be improved in a
            <a href="https://github.com/EconViz/econ-viz/issues/new?title=[Docs]+{title}&body=Page:+{url}" target="_blank" rel="noopener">GitHub issue</a>.
  consent:
    title: Cookie consent
    description: >-
      We use analytics cookies to understand how the documentation is used
      and improve it, and load repository stats from GitHub.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics: Google Analytics
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:contact@econ-viz.org
      name: contact@econ-viz.org
    - icon: fontawesome/brands/github
      link: https://github.com/EconViz
      name: EconViz on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/econ-viz/
      name: econ-viz on PyPI

hooks:
  - hooks/changelog.py
  - hooks/i18n_404.py

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          site_description: 用 Python 繪製出版品質的個體經濟學圖形：無異曲線、預算限制、消費者均衡與 TikZ 匯出。
          extra:
            analytics:
              provider: google
              property: !ENV [GOOGLE_ANALYTICS_ID, ""]
              feedback:
                title: 這頁有幫助嗎？
                ratings:
                  - icon: material/thumb-up-outline
                    name: 這頁有幫助
                    data: 1
                    note: 謝謝你的回饋
                  - icon: material/thumb-down-outline
                    name: 這頁可以改進
                    data: 0
                    note: >-
                      謝謝你的回饋。歡迎到
                      <a href="https://github.com/EconViz/econ-viz/issues/new?title=[Docs]+{title}&body=Page:+{url}" target="_blank" rel="noopener">GitHub issue</a>
                      告訴我們哪裡需要改進。
            consent:
              title: Cookie 設定
              description: 我們使用分析 Cookie 了解文件的使用方式並持續改善內容。
              actions:
                - accept
                - reject
                - manage
              cookies:
                analytics: Google Analytics
                github: false
          nav_translations:
            Home: 首頁
            Getting Started: 入門
            Installation: 安裝
            Quick Start: 快速開始
            CLI: 命令列工具
            Drawing & Teaching: 繪圖與教學
            Canvas: Canvas 畫布
            Figures & Demand Diagrams: 多面板圖與需求圖
            Animation: 動畫
            Interactive Widgets: 互動元件
            Themes: 主題
            Export: 匯出
            Models: 模型
            Overview: 總覽
            Core Models: 核心模型
            Cobb-Douglas: Cobb-Douglas
            Perfect Substitutes: 完全替代
            CES: CES
            Translog: Translog
            Satiation: 飽和
            Quasi-Linear: 準線性
            Stone-Geary: Stone-Geary
            Advanced Models: 進階模型
            Tools & Analysis: 工具與分析
            Analysis: 分析
            LaTeX Parsing: LaTeX 解析
            Project: 專案
            Changelog: 更新紀錄
        - locale: zh-CN
          name: 简体中文
          build: true
          theme:
            language: zh
          site_description: 用 Python 绘制出版质量的微观经济学图形：无差异曲线、预算约束、消费者均衡与 TikZ 导出。
          extra:
            analytics:
              provider: google
              property: !ENV [GOOGLE_ANALYTICS_ID, ""]
              feedback:
                title: 这页有帮助吗？
                ratings:
                  - icon: material/thumb-up-outline
                    name: 这页有帮助
                    data: 1
                    note: 谢谢你的反馈
                  - icon: material/thumb-down-outline
                    name: 这页可以改进
                    data: 0
                    note: >-
                      谢谢你的反馈。欢迎到
                      <a href="https://github.com/EconViz/econ-viz/issues/new?title=[Docs]+{title}&body=Page:+{url}" target="_blank" rel="noopener">GitHub issue</a>
                      告诉我们哪里需要改进。
            consent:
              title: Cookie 设置
              description: 我们使用分析 Cookie 了解文档的使用方式并持续改善内容。
              actions:
                - accept
                - reject
                - manage
              cookies:
                analytics: Google Analytics
                github: false
          nav_translations:
            Home: 首页
            Getting Started: 入门
            Installation: 安装
            Quick Start: 快速开始
            CLI: 命令行工具
            Drawing & Teaching: 绘图与教学
            Canvas: Canvas 画布
            Figures & Demand Diagrams: 多面板图与需求图
            Animation: 动画
            Interactive Widgets: 交互组件
            Themes: 主题
            Export: 导出
            Models: 模型
            Overview: 概览
            Core Models: 核心模型
            Cobb-Douglas: Cobb-Douglas
            Perfect Substitutes: 完全替代
            CES: CES
            Translog: Translog
            Satiation: 饱和
            Quasi-Linear: 拟线性
            Stone-Geary: Stone-Geary
            Advanced Models: 高级模型
            Tools & Analysis: 工具与分析
