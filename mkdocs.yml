site_name: EconViz
site_url: https://econ-viz.org
site_description: "Open-source Python packages for economics diagrams: utility-viz, principle-viz, mosaickit and bezierkit."
site_author: Pin Yue Sung
repo_url: https://github.com/EconViz
repo_name: EconViz
copyright: >-
  &copy; 2026 Pin Yue Sung ·
  <a href="#__consent">Change cookie settings</a>

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - announce.dismiss
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/extra.css
  - stylesheets/api-reference.css

extra_javascript:
  - javascripts/api-highlight.js
  - javascripts/katex.js
  - javascripts/model-toc.js
  - javascripts/analytics-events.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: docs/assets/diagrams
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  pdf_manual_base_url: https://github.com/EconViz/agora/releases/download/v1.0.0b1
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_ID, ""]
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback. Tell us what could be improved in a
            <a href="https://github.com/EconViz/utility-viz/issues/new?title=[Docs]+{title}&body=Page:+{url}" target="_blank" rel="noopener">GitHub issue</a>.
  consent:
    title: Cookie consent
    description: >-
      We use analytics cookies to understand how the documentation is used
      and improve it, and load repository stats from GitHub.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics: Google Analytics
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:contact@econ-viz.org
      name: contact@econ-viz.org
    - icon: fontawesome/brands/github
      link: https://github.com/EconViz
      name: EconViz on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/utility-viz/
      name: utility-viz on PyPI

hooks:
  - hooks/i18n_404.py
  - hooks/citations.py
  - hooks/api_reference.py

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          site_description: "用 Python 繪製經濟學圖形的開源套件：utility-viz、principle-viz、mosaickit 與 bezierkit。"
          copyright: >-
            &copy; 2026 Pin Yue Sung ·
            <a href="#__consent">變更 Cookie 設定</a>
          extra:
            analytics:
              provider: google
              property: !ENV [GOOGLE_ANALYTICS_ID, ""]
              feedback:
                title: 這頁有幫助嗎？
                ratings:
                  - icon: material/thumb-up-outline
                    name: 這頁有幫助
                    data: 1
                    note: 謝謝你的回饋
                  - icon: material/thumb-down-outline
                    name: 這頁可以改進
                    data: 0
                    note: >-
                      謝謝你的回饋。歡迎到
                      <a href="https://github.com/EconViz/utility-viz/issues/new?title=[Docs]+{title}&body=Page:+{url}" target="_blank" rel="noopener">GitHub issue</a>
                      告訴我們哪裡需要改進。
            consent:
              title: Cookie 設定
              description: 我們使用分析 Cookie 了解文件的使用方式並持續改善內容，也會從 GitHub 載入 repo 數據。
              actions:
                - accept
                - reject
                - manage
              cookies:
                analytics: Google Analytics
